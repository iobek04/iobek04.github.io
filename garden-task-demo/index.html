<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Search Task: Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="garden.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 16px; box-sizing: border-box; font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif; font-size: 18px; }
  #app { width: 100%; max-width: 900px; }
  .gt-garden { grid-template-rows: repeat(10, minmax(0, 1fr)); }
  .gt-bush { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .gt-stage, .gt-card { width: 100%; max-width: 680px; }
  .gt-card { max-width: 900px; align-items: center; text-align: center; }
  .gt-card p { margin: 0 auto; }
  .gt-tag { color: var(--leaf); font-weight: 700; font-size: 18px; }
  .gt-muted { color: var(--ink-2); font-size: 16px; }
  .gt-results { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .gt-result { background: var(--surface); border-radius: 14px; padding: 8px 16px 10px; display: flex; flex-direction: column; align-items: center; min-width: 120px; }
  .gt-result .gt-puppet { width: 64px; height: auto; }
  .gt-result strong { font-size: 18px; }
  .gt-result span { font-size: 15px; color: var(--ink-2); }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="gardens.js"></script>
  <script src="garden-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
